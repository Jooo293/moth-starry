<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>走进梵高的两幅画：从《帝王蛾》飞入《星月夜》</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05070b;cursor:none}
  body{display:flex;align-items:center;justify-content:center}
  #stage{position:relative;overflow:hidden;background:#6f9f82}
  canvas{display:block}
  #veil{position:absolute;inset:0;background:#6f9f82;opacity:1;transition:opacity 2.2s ease,background-color 0s;pointer-events:none}

  /* ---------- welcome wall: the two paintings, hung like in a gallery ---------- */
  #intro{
    --wall:#1e2d4a; --wall-lit:#2c4166; --moon:#ecc94b; --cream:#ece5c6; --mist:#a3b5cb; --frame:#2a2016;
    position:fixed; inset:0; z-index:10; cursor:auto; color:var(--cream);
    font-family:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","Iowan Old Style","Palatino Linotype",Palatino,serif;
    background:
      radial-gradient(ellipse 34% 52% at 30% 40%, var(--wall-lit), transparent 70%),
      radial-gradient(ellipse 40% 52% at 70% 40%, var(--wall-lit), transparent 70%),
      var(--wall);
    display:grid; grid-template-rows:1fr auto; transition:opacity 1.4s ease;
  }
  #intro[hidden]{display:none}
  #intro.leaving{opacity:0; pointer-events:none}
  #intro .hang{position:relative; display:flex; align-items:center; justify-content:center; gap:clamp(48px,9vw,150px); padding:5vh 5vw 0}
  #intro figure{margin:0; display:flex; flex-direction:column; align-items:flex-start}
  #intro .frame{background:var(--frame); padding:clamp(6px,.7vw,11px);
    box-shadow:inset 0 0 0 1px #4a3a26, 0 18px 40px -12px rgba(5,10,25,.75), 0 2px 6px rgba(5,10,25,.5)}
  #intro img{display:block; width:auto}
  #intro figure.moth img{height:min(54vh,30vw)}
  #intro figure.starry img{height:min(44vh,34vw)}
  #intro figcaption{margin-top:1.1em; font-size:13px; line-height:1.55; color:var(--mist); max-width:26em}
  #intro figcaption b{display:block; font-weight:600; font-size:16px; color:var(--cream); letter-spacing:.02em}
  #intro figcaption i{font-style:italic; font-family:"Iowan Old Style","Palatino Linotype",Palatino,serif}
  #intro figcaption .role{display:block; margin-top:.35em; color:var(--moon)}
  #intro svg.route{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible}
  #intro svg.route path{fill:none; stroke:var(--moon); stroke-width:2; stroke-linecap:round; stroke-dasharray:2 9}
  #intro svg.route circle{fill:var(--moon)}
  #intro svg.route circle.ring{fill:none; stroke:var(--moon); stroke-width:1.5}
  #intro .text{display:grid; grid-template-columns:auto minmax(0,34em) auto; align-items:end; justify-content:space-between; gap:2.5vw 4vw;
    padding:3vh 3vw 4.5vh; border-top:1px solid rgba(236,229,198,.12); margin:0 6vw}
  #intro h1{margin:0; font-weight:600; font-size:clamp(30px,3.4vw,52px); line-height:1.1; letter-spacing:.06em}
  #intro p{margin:0; font-size:15px; line-height:1.85; color:var(--mist)}
  #intro p strong{font-weight:600; color:var(--cream)}
  #intro .go{display:flex; flex-direction:column; align-items:flex-start; gap:.7em}
  #intro button{font:inherit; font-size:17px; letter-spacing:.08em; color:#1e2d4a; background:var(--moon);
    border:0; border-radius:999px; padding:.8em 1.9em; cursor:pointer; transition:background .2s, transform .2s}
  #intro button:hover:not(:disabled){background:#f6db72}
  #intro button:active:not(:disabled){transform:scale(.97)}
  #intro button:focus-visible{outline:2px solid var(--cream); outline-offset:4px}
  #intro button:disabled{background:transparent; color:var(--mist); box-shadow:inset 0 0 0 1px rgba(163,181,203,.45); cursor:progress}
  #intro .go small{font-size:12.5px; color:var(--mist)}
  @media (max-width:900px), (max-aspect-ratio:1/1){
    #intro{overflow:auto; grid-template-rows:auto auto}
    #intro .hang{flex-direction:column; gap:7vh; padding-top:6vh}
    #intro figure.moth img{height:auto; width:min(52vw,280px)}
    #intro figure.starry img{height:auto; width:min(80vw,440px)}
    #intro .text{grid-template-columns:1fr; padding:5vh 1vw 8vh}
    #intro svg.route{display:none}
  }
  @media (prefers-reduced-motion:no-preference){
    #intro svg.route path{animation:route 3.2s .5s ease-in-out both}
    #intro svg.route circle.ring{animation:ring 3.2s .5s both}
  }
  @keyframes route{from{stroke-dasharray:0 var(--len)} 99%{stroke-dasharray:2 9} to{stroke-dasharray:2 9}}
  @keyframes ring{0%,85%{opacity:0} to{opacity:1}}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"><div id="veil"></div></div>
<section id="intro" aria-labelledby="intro-title">
  <div class="hang">
    <figure class="moth">
      <div class="frame"><img src="assets/emperor-moth.webp" alt="梵高《帝王蛾》：一只蓝绿色的帝王蛾停在马蹄莲叶上，上方是红色浆果"></div>
      <figcaption><b>帝王蛾</b><i>Emperor Moth</i>，1889 年，圣雷米<br>布面油画，阿姆斯特丹梵高博物馆藏<span class="role">镜头从这里起飞</span></figcaption>
    </figure>
    <figure class="starry">
      <div class="frame"><img src="assets/starry-night.webp" alt="梵高《星月夜》：旋转的夜空、新月与星星，下方是柏树、山丘和村庄"></div>
      <figcaption><b>星月夜</b><i>The Starry Night</i>，1889 年，圣雷米<br>布面油画，纽约现代艺术博物馆藏<span class="role">镜头在这里落幕</span></figcaption>
    </figure>
    <svg class="route" aria-hidden="true"><path/><circle r="4"/><circle class="ring" r="9"/></svg>
  </div>
  <div class="text">
    <h1 id="intro-title">走进梵高的两幅画</h1>
    <p>这个网站把经典画作变成一段连续的镜头。画里的帝王蛾会从叶子上起飞，穿过马蹄莲叶丛，一路飞进《星月夜》的旋涡星空。画面里的一切都来自这两幅原作，<strong>镜头一刻不停，约一分半钟。</strong></p>
    <div class="go">
      <button id="start" type="button" disabled>正在准备画面…</button>
      <small>有背景音乐，建议开声音、全屏观看</small>
    </div>
  </div>
</section>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* Assets. build.py fills these in two ways: as data: URIs for the single-file build (index.html, which
 * runs straight off the disk), or as paths next to the page for the web build (site/, which streams
 * them so the welcome wall appears at once). */
const MOTH_SRC = 'assets/moth.webp';     // the emperor moth, cut out from Van Gogh's painting
const MUSIC_URL = 'assets/music.mp3';   // set in the web build; empty when the song is embedded below
const MUSIC_B64 = '';

/* ---------------- seeded randomness (same film every run) ---------------- */
let seed = 1889;
function rng() { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const R = (a, b) => a + (b - a) * rng();
const pick = a => a[Math.floor(rng() * a.length)];
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const UP = V(0, 1, 0);
const hexRGB = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const c255 = x => Math.round(clamp(x, 0, 255));
function jit(h, a = 12) { const c = hexRGB(h), d = R(-a, a);
  return `rgb(${c255(c[0] + d + R(-a, a) * .45)},${c255(c[1] + d + R(-a, a) * .45)},${c255(c[2] + d + R(-a, a) * .45)})`; }
const rgb01 = (h, a = 0) => { const c = hexRGB(h), d = R(-a, a); return [clamp(c[0] / 255 + d, 0, 1), clamp(c[1] / 255 + d, 0, 1), clamp(c[2] / 255 + d, 0, 1)]; };

/* ---------------- 9:16 stage ---------------- */
const stage = document.getElementById('stage'), veil = document.getElementById('veil');
// landscape, filling the whole window (fullscreen = the screen's own ratio); ?ar=16:9 letterboxes to an exact ratio
const AR = (() => { const m = /^(\d+(?:\.\d+)?)[:x](\d+(?:\.\d+)?)$/.exec(new URLSearchParams(location.search).get('ar') || ''); return m ? m[1] / m[2] : 0; })();
function stageSize() {
  if (!AR) return [innerWidth, innerHeight];
  let w = innerWidth, h = Math.round(w / AR); if (h > innerHeight) { h = innerHeight; w = Math.round(h * AR); } return [w, h];
}
// keep a ~68° horizontal view at any landscape ratio
const fovFor = a => THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(34)) / Math.max(a, 1.2)));
let [SW, SH] = stageSize();
const Q = new URLSearchParams(location.search);
let pr = Q.get('pr') ? clamp(+Q.get('pr'), .5, 3) : clamp(Math.max(devicePixelRatio, 1080 / SH), 1, 2);

const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.insertBefore(renderer.domElement, veil);
const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());
const camera = new THREE.PerspectiveCamera(44, 16 / 9, 0.05, 1600);

/* ======================================================================
 *  PAINTER — every procedural texture is "painted" with impasto strokes.
 *  Each stroke is drawn twice: in colour, and in grey on a height canvas
 *  (thick paint ridges) used for bump + displacement relief.
 * ====================================================================== */
class Painter {
  constructor(w, h, bg, hbg = '#6a6a6a') {
    this.w = w; this.h = h;
    this.c = document.createElement('canvas'); this.c.width = w; this.c.height = h;
    this.hc = document.createElement('canvas'); this.hc.width = w; this.hc.height = h;
    this.x = this.c.getContext('2d'); this.hx = this.hc.getContext('2d');
    this.both = [this.x, this.hx];
    for (const c of this.both) { c.lineCap = 'round'; c.lineJoin = 'round'; }
    if (bg) { this.x.fillStyle = bg; this.x.fillRect(0, 0, w, h); }
    this.hx.fillStyle = hbg; this.hx.fillRect(0, 0, w, h);
  }
  gray(h) { const g = c255(h * 255); return `rgb(${g},${g},${g})`; }
  _q(ctx, x, y, cx, cy, ex, ey, w, style, alpha = 1) {
    ctx.globalAlpha = alpha; ctx.strokeStyle = style; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(cx, cy, ex, ey); ctx.stroke(); ctx.globalAlpha = 1;
  }
  // a single loaded-brush stroke with bristle streaks
  sweep(x, y, a, len, curv, w, col, h = R(.5, .9), alpha = 1) {
    const ex = x + Math.cos(a) * len, ey = y + Math.sin(a) * len;
    const nx = -Math.sin(a), ny = Math.cos(a);
    const cx = (x + ex) / 2 + nx * curv * len, cy = (y + ey) / 2 + ny * curv * len;
    this._q(this.x, x, y, cx, cy, ex, ey, w, col, alpha);
    this._q(this.hx, x, y, cx, cy, ex, ey, w, this.gray(h));
    const nb = w > 5 ? 2 + (rng() * 2 | 0) : 0;
    for (let k = 0; k < nb; k++) {
      const o = R(-.38, .38) * w, lw = Math.max(1, w * R(.1, .22)), light = rng() < .5;
      const args = [x + nx * o, y + ny * o, cx + nx * o, cy + ny * o, ex + nx * o * .8, ey + ny * o * .8, lw];
      this._q(this.x, ...args, light ? `rgba(255,250,220,${.24 * alpha})` : `rgba(10,30,40,${.2 * alpha})`);
      this._q(this.hx, ...args, this.gray(h + (light ? .16 : -.16)));
    }
  }
  disc(x, y, r, col, h = .8) {
    for (const [ctx, st] of [[this.x, col], [this.hx, this.gray(h)]]) {
      ctx.fillStyle = st; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
  }
  arcStroke(x, y, r, a0, a1, w, col, h = .85, alpha = 1) {
    for (const [ctx, st] of [[this.x, col], [this.hx, this.gray(h)]]) {
      ctx.globalAlpha = ctx === this.x ? alpha : 1;
      ctx.strokeStyle = st; ctx.lineWidth = w; ctx.beginPath(); ctx.arc(x, y, r, a0, a1); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
  textures(repeat = false) {
    const map = new THREE.CanvasTexture(this.c); map.colorSpace = THREE.SRGBColorSpace;
    const bump = new THREE.CanvasTexture(this.hc);
    for (const t of [map, bump]) { t.anisotropy = ANISO; if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping; }
    return { map, bump };
  }
}
const tick = () => new Promise(r => setTimeout(r, 0));
await tick();

/* ======================================================================
 *  PART 1 — EMPEROR MOTH FOLIAGE (palette sampled from the painting)
 * ====================================================================== */
const LEAF_PALETTES = [
  { base: ['#a9cf9a', '#b8d8a3', '#9dc79a', '#c3dba6', '#aed3a4'], light: ['#dfe3a8', '#e9e6b1', '#d3dc9b'], vein: '#ece6a5', edge: '#2c5638', edge2: '#4f8a5c' },
  { base: ['#a6ad4e', '#b4b15a', '#98a246', '#bdb866', '#a9a952'], light: ['#d8d17d', '#cfc76c', '#e3d98b'], vein: '#e2db8c', edge: '#36552a', edge2: '#5f7f3a' },
  { base: ['#7ea852', '#8bb35b', '#6f9c4c', '#94b865', '#82ab58'], light: ['#b8cc78', '#c8d488'], vein: '#d5d68b', edge: '#26472d', edge2: '#4d7a40' },
  { base: ['#5c8a3e', '#4f7d3a', '#668f44', '#6f9a4a', '#58853f'], light: ['#8fb060', '#9cb86a'], vein: '#a8bf6f', edge: '#1c3925', edge2: '#36623a' },
  { base: ['#5fa088', '#6fae92', '#4f9180', '#7bb89a', '#66a68c'], light: ['#a7cfa7', '#bcd9ae'], vein: '#cfe0b0', edge: '#1e4a40', edge2: '#357060' },
  { base: ['#c2ce86', '#cbd18e', '#b5c57b', '#bfcb83'], light: ['#e8e4a4', '#efe8b3'], vein: '#f2ecb8', edge: '#3c683d', edge2: '#6f9a55' },
];
const PAL_WEIGHTS = [0.22, 0.19, 0.2, 0.11, 0.13, 0.15];
function pickPalette() { let r = rng(), i = 0; while (i < PAL_WEIGHTS.length - 1 && (r -= PAL_WEIGHTS[i]) > 0) i++; return i; }

function leafTexture(pal) {
  const W = 320, H = 1024, p = new Painter(W, H, pal.base[0], '#6e6e6e');
  for (let i = 0; i < 520; i++) {
    const y = R(-40, H + 40), side = rng() < .5 ? -1 : 1, x0 = W / 2 + side * R(-6, W * .22);
    const a = side > 0 ? -R(.35, 1.05) : -Math.PI + R(.35, 1.05);
    p.sweep(x0, y, a, R(60, 170), R(-.22, .22), R(10, 24), jit(pick(pal.base), 13), R(.4, .8));
  }
  for (let i = 0; i < 130; i++) {
    const side = rng() < .5 ? -1 : 1, a = side > 0 ? -R(.6, 1.3) : -Math.PI + R(.6, 1.3);
    p.sweep(W / 2 + side * R(0, W * .3), R(0, H), a, R(40, 130), R(-.2, .2), R(6, 15), jit(pick(pal.light), 10), R(.7, 1));
  }
  for (let k = 0; k < 5; k++) { let y = H + 10;
    while (y > -10) { const l = R(60, 140);
      p.sweep(W / 2 + R(-9, 9), y, -Math.PI / 2 + R(-.1, .1), l, R(-.08, .08), R(5, 12) * (.55 + y / H * .6), jit(pal.vein, 10), R(.85, 1));
      y -= l * .8; } }
  for (const side of [0, 1]) for (const [x0, x1, wa, wb, col, al] of [[3, 13, 13, 20, pal.edge, 1], [18, 32, 6, 11, pal.edge2, .85]]) {
    let y = H + 10;
    while (y > -10) { const l = R(50, 120), x = side ? W - R(x0, x1) : R(x0, x1);
      p.sweep(x, y, -Math.PI / 2 + R(-.07, .07), l, R(-.05, .05), R(wa, wb), jit(col, 8), R(.75, 1), al);
      y -= l * .75; }
  }
  return p.textures();
}
function berryTexture() {
  const p = new Painter(256, 128, '#c63a22', '#808080');
  for (let i = 0; i < 160; i++) p.sweep(R(0, 256), R(10, 118), R(0, 6.28), R(10, 34), R(-.6, .6), R(4, 10),
    jit(pick(['#e2662f', '#b02a1a', '#d24a26', '#ef8a3c', '#9b2316']), 10), R(.5, 1));
  for (let i = 0; i < 14; i++) p.sweep(R(0, 256), R(14, 40), R(-.4, .4), R(16, 40), .4, R(5, 9), jit('#f4a35e', 8), 1);
  return p.textures(true);
}
function groundTexture(bg, pal, accents, n = 2600) {
  const p = new Painter(1024, 1024, bg, '#707070');
  for (let i = 0; i < n; i++) p.sweep(R(-40, 1064), R(-40, 1064), -0.7 + R(-.5, .5), R(30, 90), R(-.2, .2), R(8, 18), jit(pick(pal), 12), R(.4, .9));
  for (let i = 0; i < 380; i++) p.sweep(R(0, 1024), R(0, 1024), -1.0 + R(-.4, .4), R(18, 45), R(-.2, .2), R(4, 8), jit(pick(accents), 8), R(.8, 1));
  return p.textures(true);
}
function foliageBackdrop() {
  const W = 2048, H = 1024, p = new Painter(W, H, '#4f9a84');
  const sky = ['#3f8f7c', '#4f9c86', '#6fb29a', '#8cc4a8', '#a9d2b2', '#5aa08a', '#79b89d'];
  for (let i = 0; i < 5200; i++) { const y = R(-60, H * .54), hz = smooth(H * .3, H * .52, y);
    const col = rng() < hz * .7 ? jit(pick(['#79ab8f', '#82b293', '#73a68b']), 8) : jit(pick(sky), 13);
    p.sweep(R(-20, W + 20), y, -Math.PI / 2 + R(-.12, .12), R(40, 180), R(-.08, .08), R(6, 16), col, .5); }
  for (let i = 0; i < 420; i++) p.sweep(R(0, W), R(0, H * .45), -Math.PI / 2 + R(-.1, .1), R(60, 200), R(-.05, .05), R(4, 9), jit('#cfe0b4', 10), .5, .8);
  for (let i = 0; i < 520; i++) p.sweep(R(0, W), R(0, H * .45), -Math.PI / 2 + R(-.1, .1), R(60, 220), R(-.05, .05), R(2, 5), jit('#2a6655', 10), .5, .7);
  for (let i = 0; i < 2600; i++) { const y = R(H * .5, H + 40);
    p.sweep(R(-20, W + 20), y, -0.6 + R(-.4, .4), R(30, 90), R(-.2, .2), R(8, 16),
      jit(pick(y < H * .58 ? ['#79ab8f', '#86b192', '#7fa98a'] : ['#a2a852', '#8f9e4c', '#b3b25e', '#7d9a5a']), 10), .5); }
  // melt the painted backdrop into the fog colour towards the horizon (no hard edge against the fogged ground)
  const g = p.x.createLinearGradient(0, H * .3, 0, H * .52);
  g.addColorStop(0, 'rgba(121,171,143,0)'); g.addColorStop(.75, 'rgba(121,171,143,.85)'); g.addColorStop(1, 'rgba(121,171,143,1)');
  p.x.fillStyle = g; p.x.fillRect(0, H * .3, W, H * .7);
  const t = p.textures(true).map; t.repeat.set(3, 1);
  return t;
}

/* ---------------- calla leaf: a true curved 3D surface ---------------- */
function leafSpec(len, broad = false) {
  return { len, wid: len * (broad ? R(.24, .32) : R(.13, .21)), bend: len * R(.15, .75), sway: len * R(-.15, .15),
    droop: R(0, .32), twist: R(-.9, .9), cup: R(.15, .45), fold: R(0, .4), ruffle: broad ? R(.08, .14) : R(.02, .07),
    stalk: broad ? R(.1, .18) : R(.2, .34), shape: R(.45, .68), wave: broad ? R(.07, .13) : R(.02, .07), waveF: R(8, 22), ph: R(0, 6.28) };
}
function leafGeometry(o, SU = 14, SV = 56) {
  const L = o.len;
  const P0 = V(), P1 = V(o.sway * .2, L * .45, o.bend * .05), P2 = V(o.sway, L * .88, o.bend * .5), P3 = V(o.sway * 1.3, L * (.82 - o.droop), o.bend);
  const D0 = P1.clone().sub(P0), D1 = P2.clone().sub(P1), D2 = P3.clone().sub(P2);
  const frame = v => {
    const u = 1 - v;
    const p = V().addScaledVector(P0, u * u * u).addScaledVector(P1, 3 * u * u * v).addScaledVector(P2, 3 * u * v * v).addScaledVector(P3, v * v * v);
    const T = V().addScaledVector(D0, 3 * u * u).addScaledVector(D1, 6 * u * v).addScaledVector(D2, 3 * v * v).normalize();
    const ref = V(1, 0, 0), B = ref.addScaledVector(T, -ref.dot(T)).normalize(), N = V().crossVectors(B, T);
    const tw = o.twist * v * v, c = Math.cos(tw), s = Math.sin(tw);

  camera.position.copy(camPos).add(V(.03 * Math.sin(t * .31), .025 * Math.sin(t * .43 + 2), .02 * Math.sin(t * .27)));
  camera.lookAt(camTgt);
  camera.rotateZ(-.08 * (1 - w) + .016 * Math.sin(t * .21) - st.bank * .18);
  backdropA.position.copy(camera.position); dome.position.copy(camera.position); skyGroup.position.copy(camera.position);

  for (const g of glows) { const k = 1 + .06 * Math.sin(t * 1.3 + g.ph); g.m.scale.setScalar(g.size * k); g.m.material.opacity = g.base * (.85 + .15 * Math.sin(t * .9 + g.ph)); }

  // end of the journey: dissolve to night blue and begin again
  if (!st.ending && s > PATH_LEN - 7) {
    st.ending = true; st.endAt = performance.now(); veil.style.backgroundColor = '#10204a'; veil.style.opacity = 1;
    setTimeout(() => { startTake(); veil.style.backgroundColor = '#6f9f82'; requestAnimationFrame(() => { veil.style.opacity = 0; }); }, 2400);
  }
}

function render() {
  const f = st.fade;
  if (f < 1) { moth.enter(sceneA, mothMat.A); renderer.setRenderTarget(rtA); renderer.render(sceneA, camera); }
  if (f > 0) { moth.enter(sceneB, mothMat.B); renderer.setRenderTarget(rtB); renderer.render(sceneB, camera); }
  post.uniforms.uFade.value = f;
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
}

// if the GPU can't hold ~50 fps, drop resolution once — during the still opening, before the flight begins
let last = performance.now(), perfFrames = 0, perfTime = 0, playing = false;
renderer.setAnimationLoop(() => {
  const now = performance.now(), raw = (now - last) / 1000, dt = Math.min(raw, 1 / 20); last = now;
  if (!Q.get('pr') && st.t > .5 && st.t < 2.5 && pr > 1) {
    perfFrames++; perfTime += raw;
    if (perfFrames === 60 && perfTime / 60 > 1 / 48) { pr = Math.max(1, pr * .75); applySize(); }
  }
  if (!window.__hold && playing) update(dt);
  syncMusic(now);
  render();
});
// for inspection from the console: __moth.seek(40) jumps 40 s into the take
window.__moth = { st, PATH_LEN, sB0, seek(T) { window.__hold = true; reset(); for (let k = 0; k < T * 30; k++) update(1 / 30); render(); } };
requestAnimationFrame(() => { veil.style.opacity = 0; });

/* ---------------- background music, tied to the take ----------------
 * Each take starts the song from the beginning (fade in) and fades it out with the final dissolve,
 * so every loop is the same self-contained clip. If the browser blocks audio autoplay, the opening
 * frame holds and the take starts — with the music — on the first click or key press. */
const music = Q.get('music') === '0' ? null : (() => {
  let src = MUSIC_URL;
  if (!src) {
    const bin = atob(MUSIC_B64), u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    src = URL.createObjectURL(new Blob([u8], { type: 'audio/mpeg' }));
  }
  const a = new Audio(src);
  a.preload = 'auto'; a.volume = 0;
  return a;
})();
const VOL = clamp(parseFloat(Q.get('vol') || '0.85'), 0, 1);
// the music follows the picture: it pauses when frames stop arriving and re-syncs if it drifts
let lastFrame = 0, stalled = false;
function syncMusic(now) {
  lastFrame = now;
  if (!music || !playing) return;
  if (stalled && !document.hidden) { stalled = false; music.play().catch(() => {}); }
  if (!music.paused && st.t < music.duration - 1 && Math.abs(music.currentTime - st.t) > .35) music.currentTime = st.t;
  let v = VOL * smooth(0, 2.5, st.t);
  if (st.ending) v *= 1 - clamp((now - st.endAt) / 2200, 0, 1);
  music.volume = clamp(v, 0, 1);
}
if (music) music.addEventListener('timeupdate', () => {
  if (playing && !music.paused && performance.now() - lastFrame > 300) { music.pause(); stalled = true; }
});
function startTake() {
  reset();
  if (music) { music.pause(); music.currentTime = 0; music.volume = 0; music.play().catch(() => {}); }
}
/* ---------------- welcome wall ----------------
 * The wall is shown while the 3D scene is being built; "开始观看" starts the take and the music together
 * (the click also satisfies the browser's rule that sound needs a user action). ?music=0 skips the wall. */
const intro = document.getElementById('intro'), startBtn = document.getElementById('start');
function drawRoute() {
  const svg = intro.querySelector('svg.route'), box = svg.getBoundingClientRect();
  const a = intro.querySelector('.moth img').getBoundingClientRect(), b = intro.querySelector('.starry img').getBoundingClientRect();
  if (!a.width || !b.width) return;
  const x0 = a.left + a.width * .5 - box.left, y0 = a.top + a.height * .6 - box.top;      // the moth's body
  const x1 = b.left + b.width * .49 - box.left, y1 = b.top + b.height * .34 - box.top;    // the eye of the great swirl
  const lift = Math.max(Math.min(a.top, b.top) - box.top - 26, 22);
  const path = svg.querySelector('path');
  path.setAttribute('d', `M${x0},${y0} C${x0 + a.width * .9},${lift} ${x1 - b.width * .5},${lift - 10} ${x1},${y1}`);
  path.style.setProperty('--len', path.getTotalLength());
  const [dot, ring] = svg.querySelectorAll('circle');
  dot.setAttribute('cx', x0); dot.setAttribute('cy', y0); ring.setAttribute('cx', x1); ring.setAttribute('cy', y1);
}
function begin() {
  if (playing) return;
  playing = true; startTake();
  intro.classList.add('leaving');
  setTimeout(() => { intro.hidden = true; }, 1500);
}
if (!music) { intro.hidden = true; playing = true; }
else {
  drawRoute(); addEventListener('resize', drawRoute);
  for (const img of intro.querySelectorAll('img')) if (!img.complete) img.addEventListener('load', drawRoute);
  startBtn.disabled = false; startBtn.textContent = '开始观看'; startBtn.focus({ preventScroll: true });
  startBtn.addEventListener('click', begin);
}
// a hidden tab stops the animation, so stop the music with it and keep the two in step
if (music) addEventListener('visibilitychange', () => {
  if (!playing) return;
  if (document.hidden) { music.pause(); stalled = true; }
});
window.__music = music;
</script>
</body>
</html>
